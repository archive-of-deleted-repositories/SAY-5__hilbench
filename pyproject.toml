[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hilbench"
version = "0.1.0"
description = "A hardware-in-the-loop test automation framework with timing budget assertions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SAY-5" }]
keywords = ["test-automation", "hardware-in-the-loop", "hil", "ci", "simulation"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
hilbench = "hilbench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=hilbench --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["hilbench"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
packages = ["hilbench"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
